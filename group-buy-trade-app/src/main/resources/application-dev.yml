server:
  port: 8093

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:124.221.233.121:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  datasource:
    username: trade_user
    password: trade_password_123456
    url: jdbc:mysql://${MYSQL_HOST:124.221.233.121}:${MYSQL_PORT:3306}/group_buy_trade?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Trade_HikariCP
      minimum-idle: 10
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

dubbo:
  application:
    name: group-buy-trade-service
    logger: slf4j
  protocol:
    name: dubbo
    port: ${DUBBO_PROTOCOL_PORT:20893}
  registry:
    address: nacos://${NACOS_HOST:124.221.233.121}:${NACOS_PORT:8848}
  scan:
    base-packages: cn.xuele.trade.trigger.rpc

logging:
  level:
    root: info

trade:
  event:
    relay:
      fixed-delay: 5000
      batch-size: 50
      max-retry-count: 5
